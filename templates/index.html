<!DOCTYPE html>
<html>
<head>
<title>TruthGuard AI Detector</title>

<style>
body{
font-family: Arial;
background:#0f172a;
color:white;
text-align:center;
padding:40px;
}

textarea{
width:80%;
height:200px;
font-size:16px;
}

button{
padding:12px 30px;
font-size:18px;
margin-top:10px;
background:#22c55e;
border:none;
color:white;
cursor:pointer;
}

.result{
margin-top:30px;
font-size:22px;
}
</style>
</head>

<body>

<h1>TruthGuard AI Detector</h1>

<p>Detect if text is AI generated</p>

<textarea id="text"></textarea>
<br>

<button onclick="detect()">Analyze</button>

<div class="result" id="result"></div>

<script>

async function detect(){

let text = document.getElementById("text").value;

let response = await fetch("/text_detect",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({text:text})
});

let data = await response.json();

document.getElementById("result").innerHTML =
"AI Probability: " + data.ai_probability + "% <br>" +
"Human Probability: " + data.human_probability + "%";

}

</script>

</body>
</html>
